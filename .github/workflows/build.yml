name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # Host-side unit tests for include/minimum_logic.hpp. No Geode SDK needed.
  tests:
    name: Logic tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure tests
        run: cmake -S tests -B build-tests

      - name: Build tests
        run: cmake --build build-tests

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to a commit SHA, not @main, so a change upstream cannot break this workflow silently.
      # The SHA is the main branch head at pin time. The v1 tags do not list iOS as a target.
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@a0f7676e6fcd1a584f6d0c1c800239008412defc
        with:
          sdk: latest
          combine: true
          target: ${{ matrix.config.target }}

  # Merges the five platform builds into ONE .geode file that works everywhere.
  # Upload that file (not the per-platform ones) when you publish.
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@a0f7676e6fcd1a584f6d0c1c800239008412defc
        id: build

      - name: Upload combined .geode
        uses: actions/upload-artifact@v4
        with:
          name: Minimum-all-platforms
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
