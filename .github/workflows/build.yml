name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode logo.png
        shell: bash
        run: |
          if [ -f logo.png.b64 ]; then
            base64 -d logo.png.b64 > logo.png 2>/dev/null || base64 --decode logo.png.b64 > logo.png
            ls -la logo.png
          fi

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          combine: false

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minimum-${{ matrix.config.name }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
